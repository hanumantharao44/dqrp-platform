services:
  postgres:
    image: postgres:16-alpine
    container_name: dqrp-postgres
    environment:
      POSTGRES_DB: dqrp
      POSTGRES_USER: dqrp
      POSTGRES_PASSWORD: dqrp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dqrp -d dqrp"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dqrp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dqrp
      RABBITMQ_DEFAULT_PASS: dqrp
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI: http://localhost:15672 (dqrp / dqrp)
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: only started with `docker compose --profile redis up`
  redis:
    image: redis:7-alpine
    container_name: dqrp-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"

  # -------------------------------------------------------------------
  # Uncomment these once the backend and frontend have Dockerfiles
  # (Day 9-10) so the whole system starts with one command.
